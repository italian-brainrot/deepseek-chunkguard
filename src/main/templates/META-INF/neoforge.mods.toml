modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="DeepSeek"
description='''
Prevents mods from synchronously loading chunks on the server tick thread.

Spawner mods sometimes probe random positions with Level.getHeight(),
Level.getFluidState() or Level.getBlockState() from a server tick handler.
If the probe lands in an unloaded chunk, vanilla waits for that chunk to load
on the tick thread. With a busy chunk pipeline this can stall a whole server
tick for minutes. ChunkGuard returns vanilla-safe empty values for those
unloaded-chunk reads and leaves normal world generation and chunk loading alone.

Known targets include Lilis Lucky Lures (FloatingPoolsSpawner) and ExtraBiomes
(GlacierSnowGolemSpawner), but the guard is generic.
'''

[[mixins]]
config="chunkguard.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
